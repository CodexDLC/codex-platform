site_name: codex-platform
site_description: Infrastructure, background tasks (ARQ), Redis service and framework adapters for Codex
site_author: Codex Team

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.breadcrumbs
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  version:
    provider: mike
    default: latest
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: Русский
      link: /ru/
      lang: ru

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details

plugins:
  - search
  - include-markdown
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Home: Главная
            Architecture: Архитектура
            Notifications: Уведомления
            Overview: Обзор
            Data Flow: Поток данных
            Redis Service: Redis Сервис
            Streams: Потоки
            Workers (ARQ): Воркеры (ARQ)
            Changelog: История изменений
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            members_order: source

nav:
  - Home: index.md
  - Architecture:
      - Notifications:
          - Overview: architecture/notifications/README.md
          - Data Flow: architecture/notifications/data_flow.md
      - Redis Service:
          - Overview: architecture/redis_service/README.md
          - Data Flow: architecture/redis_service/data_flow.md
      - Streams:
          - Overview: architecture/streams/README.md
          - Data Flow: architecture/streams/data_flow.md
      - Workers (ARQ):
          - Overview: architecture/workers/README.md
          - Data Flow: architecture/workers/data_flow.md
  - API Reference:
      - Overview: api/index.md
      - Notifications:
          - Overview: api/notifications/index.md
          - DTOs: api/notifications/dto.md
          - Channels: api/notifications/channels.md
          - Orchestrator: api/notifications/orchestrator.md
          - Registry: api/notifications/registry.md
          - Renderer: api/notifications/renderer.md
          - Delivery:
              - Base Protocol: api/notifications/delivery/base.md
              - ARQ: api/notifications/delivery/arq.md
              - Direct: api/notifications/delivery/direct.md
      - Redis Service:
          - Overview: api/redis_service/index.md
          - Base: api/redis_service/base.md
          - Keys: api/redis_service/keys.md
          - Service: api/redis_service/service.md
          - Operations:
              - Hash: api/redis_service/operations/hash.md
              - JSON (String): api/redis_service/operations/json_string.md
              - JSON (Module): api/redis_service/operations/json_module.md
              - List: api/redis_service/operations/list_.md
              - Pipeline: api/redis_service/operations/pipeline.md
              - Set: api/redis_service/operations/set_.md
              - String: api/redis_service/operations/string.md
              - ZSet: api/redis_service/operations/zset.md
      - Streams:
          - Overview: api/streams/index.md
          - Producer: api/streams/producer.md
          - Consumer: api/streams/consumer.md
          - Dispatcher: api/streams/dispatcher.md
          - Processor: api/streams/processor.md
          - Router: api/streams/router.md
      - Workers (ARQ):
          - Overview: api/workers/arq/index.md
          - Base: api/workers/arq/base.md
          - Config: api/workers/arq/config.md
          - Task Utils: api/workers/arq/task_utils.md
          - Types: api/workers/arq/types.md
  - Changelog: changelog.md