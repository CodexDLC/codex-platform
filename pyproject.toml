[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "codex-platform"
dynamic = ["version"]
description = "Modular async infrastructure (Redis, Streams, ARQ, Notifications) built for Codex, designed for independent use."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "CodexDLC" }]
keywords = ["django", "redis", "arq", "worker", "notifications", "waas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "codex-core>=0.2.0,<0.3.0",
]

[project.urls]
Homepage = "https://github.com/codexdlc/codex-platform"
Documentation = "https://codexdlc.github.io/codex-platform/"
Repository = "https://github.com/codexdlc/codex-platform"
Issues = "https://github.com/codexdlc/codex-platform/issues"

[project.optional-dependencies]
redis = ["redis>=5.0"]
arq = ["arq>=0.25"]
notifications = ["aiosmtplib>=3.0", "jinja2>=3.1"]
streams = ["codex-platform[redis]"]
all = [
    "codex-platform[redis,arq,notifications]",
]
dev = [
    "codex-platform[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "fakeredis[lua]>=2.20",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
]
docs = [
    "mkdocs>=1.5,<2.0",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-include-markdown-plugin",
    "mike>=2.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_platform"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "arq.*",
    "aiosmtplib.*",
    "django.*",
    "jinja2.*",
    "codex_platform.settings",
    "codex_platform.settings.*",
    "codex_core.*",
]
ignore_missing_imports = true

# redis-py asyncio stubs are incomplete — suppress await/return type noise
[[tool.mypy.overrides]]
module = [
    "codex_platform.redis_service.operations.*",
    "codex_platform.redis_service.operations",
    "codex_platform.streams.producer",
    "codex_platform.streams.consumer",
    "codex_platform.workers.arq.config",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: unit tests (no external dependencies)",
    "integration: integration tests (may require external services)",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B602", "B605", "B607", "B404"]
